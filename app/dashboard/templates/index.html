<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlivonex YouTube Automation Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border: 1px solid #333;
        }

        .card h2 {
            margin-bottom: 15px;
            color: #667eea;
            font-size: 1.3em;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
            padding: 10px;
            background: #0f0f0f;
            border-radius: 6px;
        }

        .stat-label {
            font-weight: 500;
            color: #b0b0b0;
        }

        .stat-value {
            font-weight: 700;
            color: #e0e0e0;
            font-size: 1.1em;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-completed { background: #10b981; color: white; }
        .status-in-progress { background: #f59e0b; color: white; }
        .status-failed { background: #ef4444; color: white; }
        .status-pending { background: #6b7280; color: white; }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #333;
        }

        th {
            background: #0f0f0f;
            color: #667eea;
            font-weight: 600;
        }

        tr:hover {
            background: #252525;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 15px;
        }

        .refresh-btn:hover {
            background: #5568d3;
        }

        .timestamp {
            text-align: center;
            color: #6b7280;
            margin-top: 20px;
            font-size: 0.9em;
        }

        .no-data {
            text-align: center;
            color: #6b7280;
            padding: 30px;
            font-style: italic;
        }

        .current-job {
            background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .current-job h2 {
            color: white;
            margin-bottom: 10px;
        }

        a {
            color: #667eea;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 Enlivonex YouTube Automation</h1>
            <p class="subtitle">Production Dashboard</p>
        </header>

        <div id="current-job-container"></div>

        <div class="grid">
            <div class="card">
                <h2>📊 System Status</h2>
                <div id="system-stats"></div>
            </div>

            <div class="card">
                <h2>🎥 Clip Library</h2>
                <div id="clip-stats"></div>
            </div>

            <div class="card">
                <h2>⚙️ Job Statistics</h2>
                <div id="job-stats"></div>
            </div>
        </div>

        <div class="card">
            <h2>📈 Recent Jobs</h2>
            <div class="table-container">
                <table id="jobs-table">
                    <thead>
                        <tr>
                            <th>Job ID</th>
                            <th>Status</th>
                            <th>Stage</th>
                            <th>Started</th>
                            <th>Duration</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <button class="refresh-btn" onclick="loadJobs()">Refresh Jobs</button>
        </div>

        <div class="card">
            <h2>🚀 YouTube Analytics</h2>
            <div class="table-container">
                <table id="analytics-table">
                    <thead>
                        <tr>
                            <th>Video</th>
                            <th>Views</th>
                            <th>Likes</th>
                            <th>Comments</th>
                            <th>Last Updated</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <button class="refresh-btn" onclick="loadAnalytics()">Refresh Analytics</button>
        </div>

        <div class="timestamp" id="last-update"></div>
    </div>

    <script>
        async function loadStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                // Current job
                const jobContainer = document.getElementById('current-job-container');
                if (data.current_job && data.current_job.status !== 'COMPLETED') {
                    jobContainer.innerHTML = `
                        <div class="current-job">
                            <h2>🔄 Current Job: ${data.current_job.job_id}</h2>
                            <p><strong>Status:</strong> ${data.current_job.status}</p>
                            <p><strong>Stage:</strong> ${data.current_job.stage}</p>
                        </div>
                    `;
                } else {
                    jobContainer.innerHTML = '';
                }

                // System stats
                document.getElementById('system-stats').innerHTML = `
                    <div class="stat">
                        <span class="stat-label">Uploaded Videos</span>
                        <span class="stat-value">${data.uploaded_videos}</span>
                    </div>
                `;

                // Clip stats
                const clipStats = data.clips || {};
                document.getElementById('clip-stats').innerHTML = `
                    <div class="stat">
                        <span class="stat-label">Available</span>
                        <span class="stat-value">${clipStats.AVAILABLE || 0}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Processing</span>
                        <span class="stat-value">${clipStats.PROCESSING || 0}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Processed</span>
                        <span class="stat-value">${clipStats.PROCESSED || 0}</span>
                    </div>
                `;

                // Job stats
                const jobStats = data.jobs || {};
                document.getElementById('job-stats').innerHTML = `
                    <div class="stat">
                        <span class="stat-label">Completed</span>
                        <span class="stat-value">${jobStats.COMPLETED || 0}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">In Progress</span>
                        <span class="stat-value">${jobStats.GENERATING_STORY || 0}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Failed</span>
                        <span class="stat-value">${jobStats.FAILED || 0}</span>
                    </div>
                `;

                document.getElementById('last-update').textContent =
                    `Last updated: ${new Date(data.timestamp).toLocaleString()}`;

            } catch (error) {
                console.error('Failed to load status:', error);
            }
        }

        async function loadJobs() {
            try {
                const response = await fetch('/api/jobs?limit=10');
                const jobs = await response.json();

                const tbody = document.querySelector('#jobs-table tbody');

                if (jobs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="no-data">No jobs found</td></tr>';
                    return;
                }

                tbody.innerHTML = jobs.map(job => {
                    const statusClass = job.status.toLowerCase().replace('_', '-');
                    const started = new Date(job.started_at).toLocaleString();
                    const duration = job.completed_at
                        ? `${Math.round((new Date(job.completed_at) - new Date(job.started_at)) / 1000)}s`
                        : 'In progress';

                    return `
                        <tr>
                            <td><strong>${job.job_id}</strong></td>
                            <td><span class="status-badge status-${statusClass}">${job.status}</span></td>
                            <td>${job.stage}</td>
                            <td>${started}</td>
                            <td>${duration}</td>
                        </tr>
                    `;
                }).join('');

            } catch (error) {
                console.error('Failed to load jobs:', error);
            }
        }

        async function loadAnalytics() {
            try {
                const response = await fetch('/api/analytics');
                const analytics = await response.json();

                const tbody = document.querySelector('#analytics-table tbody');

                if (analytics.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="no-data">No analytics data available</td></tr>';
                    return;
                }

                tbody.innerHTML = analytics.map(item => {
                    const updated = item.fetched_at
                        ? new Date(item.fetched_at).toLocaleString()
                        : 'Never';

                    return `
                        <tr>
                            <td><a href="${item.url}" target="_blank">${item.title}</a></td>
                            <td>${item.views.toLocaleString()}</td>
                            <td>${item.likes.toLocaleString()}</td>
                            <td>${item.comments.toLocaleString()}</td>
                            <td>${updated}</td>
                        </tr>
                    `;
                }).join('');

            } catch (error) {
                console.error('Failed to load analytics:', error);
            }
        }

        // Load data on page load
        loadStatus();
        loadJobs();
        loadAnalytics();

        // Auto-refresh every 10 seconds
        setInterval(() => {
            loadStatus();
            loadJobs();
        }, 10000);
    </script>
</body>
</html>
